<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbe55"/><stop offset="1" stop-color="#e8582a"/></linearGradient>
    <radialGradient id="shine" cx=".3" cy=".2" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#6b2a0a" flood-opacity=".35"/></filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#shine)"/>
  <g filter="url(#sh)">
    <!-- red column -->
    <rect x="118" y="96" width="112" height="222" rx="30" fill="#b3172f"/>
    <rect x="118" y="96" width="112" height="208" rx="30" fill="#ff4d5e"/>
    <rect x="138" y="114" width="40" height="18" rx="9" fill="#fff" opacity=".45"/>
    <!-- blue bar -->
    <rect x="118" y="330" width="276" height="96" rx="30" fill="#1846b8"/>
    <rect x="118" y="330" width="276" height="82" rx="30" fill="#3f8cff"/>
    <rect x="138" y="346" width="40" height="18" rx="9" fill="#fff" opacity=".45"/>
    <!-- yellow -->
    <rect x="252" y="96" width="100" height="104" rx="28" fill="#c77b00"/>
    <rect x="252" y="96" width="100" height="92" rx="28" fill="#ffcf3f"/>
    <rect x="270" y="112" width="34" height="16" rx="8" fill="#fff" opacity=".5"/>
    <!-- green -->
    <rect x="252" y="214" width="100" height="104" rx="28" fill="#0b8a4e"/>
    <rect x="252" y="214" width="100" height="92" rx="28" fill="#3fdc8a"/>
    <rect x="270" y="230" width="34" height="16" rx="8" fill="#fff" opacity=".5"/>
  </g>
  <!-- sparkle -->
  <path d="M410 120 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#fff" opacity=".95"/>
</svg>
