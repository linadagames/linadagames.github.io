<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
</head>
<body>
<title>Tahta Kapılar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen workshop table — status rows on top, the wooden board fills the middle, tools along the bottom.
   Each chapter of 20 levels uses a different wood; the table colors follow it. */
:root {
  --table: #b65a2b;        /* backdrop gradient (bright, changes per chapter) */
  --table-hi: #f39c4a;
  --ink: #ffffff;          /* text on the backdrop */
  --ink-dim: rgba(255,255,255,.82);
  --chip: rgba(255,255,255,.2);   /* glassy chips on the backdrop */
  --chip-hi: rgba(255,255,255,.3);
  --accent: #ffb347;       /* honey: stars, focus, coins */
  --card: #f3d6a8;         /* overlay cards */
  --card-lo: #e2b67c;
  --card-ink: #3b2414;
  --btn: #6b4226;
  --good: #2f8f55;
  --warn: #ff7b6b;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: radial-gradient(130% 90% at 50% 0%, var(--table-hi), var(--table) 75%) fixed, var(--table);
  color: var(--ink); font-family: var(--font-body); overflow: hidden; transition: background .6s;
  text-shadow: 0 1px 2px rgba(0,0,0,.18);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
/* drifting soft lights behind everything */
.bokeh { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.bokeh i { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%); animation: drift linear infinite; }
@keyframes drift { from { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(30px, -60px, 0); } to { transform: translate3d(0, 0, 0); } }
.app { position: relative; z-index: 1;
  height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px;
  max-width: 640px; margin: 0 auto; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; min-width: 0; line-height: 1; letter-spacing: .01em; }
.brand small { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-family: var(--font-body); font-weight: 700; font-size: .72rem; color: var(--ink-dim); letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.tag { font-size: .62rem; padding: 1px 6px; border-radius: 6px; background: #ff6b6b; color: #fff; letter-spacing: .04em; text-shadow: none; }
.tag.vh { background: #c92a2a; }
.top-right { display: flex; gap: 6px; align-items: center; flex: none; }
.chip { font: 800 .9rem var(--font-body); padding: 7px 10px; border-radius: 12px; background: linear-gradient(#ffe066, #fab005); color: #6b4200; text-shadow: none; box-shadow: inset 0 -3px 0 rgba(150,90,0,.35), 0 2px 6px rgba(0,0,0,.15); display: flex; align-items: center; gap: 4px; }
.chip.bump { animation: bump .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes bump { 40% { transform: scale(1.25); } }
.chip b { font-variant-numeric: tabular-nums; }
.chip.lives { background: linear-gradient(#ff8fa3, #f03e5e); color: #fff; box-shadow: inset 0 -3px 0 #c2255c, 0 2px 6px rgba(0,0,0,.15); cursor: pointer; }
.chip.lives small { font-size: .62rem; font-weight: 800; opacity: .9; font-variant-numeric: tabular-nums; }
.chip.lives.empty { animation: wiggle .8s ease-in-out infinite; }
.big-timer { font-family: var(--font-display); font-size: 2rem; font-weight: 800; margin: -4px 0 10px; font-variant-numeric: tabular-nums; }
.icon-btn { padding: 7px 10px; font-size: 1rem; position: relative; }
.icon-btn .dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: var(--chip); border-radius: 14px; padding: 5px 6px; text-align: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.1); min-width: 0; backdrop-filter: blur(4px); }
.stat b.pop { animation: bump .3s cubic-bezier(.3,1.8,.5,1); display: block; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.1rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .6rem; color: var(--ink-dim); letter-spacing: .08em; text-transform: uppercase; }
.stat.warn { background: rgba(255,80,80,.55); }
.stat.warn b { color: #fff; animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .45; } }
.stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
canvas { display: block; touch-action: none; max-width: 100%; }
.hint { text-align: center; font-size: .82rem; color: var(--ink-dim); min-height: 1.2em; }
.hint.msg { color: #fff3bf; font-weight: 800; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tools button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; font-size: .74rem; min-width: 0; }
.tools button i { font-style: normal; font-size: 1.15rem; line-height: 1; }
.tools button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools button b.badge { position: absolute; top: -5px; right: -3px; font-size: .62rem; background: #ff4757; color: #fff; border-radius: 9px; padding: 1px 6px; line-height: 1.35; text-shadow: none; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.tools button.on { outline: 3px solid #fff; animation: wiggle .6s ease-in-out infinite; }
@keyframes wiggle { 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
/* candy-colored tool buttons */
#hint { background: linear-gradient(#ffe066, #fcc419); color: #6b4200; box-shadow: inset 0 -4px 0 #e8a100; text-shadow: none; }
#hammer { background: linear-gradient(#ffa94d, #ff7a1a); box-shadow: inset 0 -4px 0 #d9480f; }
#restart { background: linear-gradient(#74c0fc, #339af0); box-shadow: inset 0 -4px 0 #1c7ed6; }
#levels { background: linear-gradient(#8ce99a, #40c057); box-shadow: inset 0 -4px 0 #2b8a3e; }
.tools button:hover { filter: brightness(1.08); }
button {
  font: 800 .88rem var(--font-body); color: var(--ink); background: var(--chip); border: 0; border-radius: 14px;
  padding: 10px 13px; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.28); transition: transform .08s, background .15s;
}
button:hover { background: var(--chip-hi); }
.icon-btn { backdrop-filter: blur(4px); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 2px 8px rgba(0,0,0,.1); }
button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.28); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }

/* overlays */
.overlay { position: fixed; inset: 0; background: rgba(30,15,40,.55); display: grid; place-items: center; z-index: 20; padding: 16px; backdrop-filter: blur(3px); }
.card {
  background: linear-gradient(var(--card), var(--card-lo)); color: var(--card-ink); border-radius: 22px; padding: 22px 20px 20px; width: min(390px, 100%);
  box-sizing: border-box; text-align: center; text-shadow: none; box-shadow: 0 18px 50px rgba(0,0,0,.35), inset 0 -6px 0 rgba(90,50,20,.25);
  max-height: calc(100vh - 32px); overflow-y: auto; animation: cardIn .4s cubic-bezier(.3,1.5,.5,1);
}
.card h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; margin: 0 0 4px; text-wrap: balance; }
.card p { margin: 0 0 12px; font-weight: 600; }
.card button { background: var(--btn); color: #fff4e3; }
.card button:hover { background: #7d4f2e; }
.card button.ghost { background: transparent; color: var(--card-ink); box-shadow: inset 0 0 0 2px var(--btn); }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.stars { font-size: 2.6rem; letter-spacing: .15em; margin: 4px 0 6px; color: rgba(90,50,20,.25); }
.stars .on { color: #f59e0b; text-shadow: 0 2px 0 #b45309; display: inline-block; animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } }
@keyframes cardIn { from { transform: scale(.7) translateY(20px); opacity: 0; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
.card button.ad { background: linear-gradient(#69db7c, #2f9e44); box-shadow: inset 0 -4px 0 #237032; }
.ad-row { margin: -4px 0 10px; }
.nudge { display: flex; align-items: center; justify-content: center; gap: 10px; align-self: center; background: linear-gradient(#fff3bf, #ffe066); color: #6b4200; text-shadow: none;
  font-weight: 800; border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: 0 6px 18px rgba(0,0,0,.18); animation: cardIn .4s cubic-bezier(.3,1.5,.5,1); }
.nudge button { padding: 7px 12px; background: linear-gradient(#ffa94d, #ff7a1a); box-shadow: inset 0 -3px 0 #d9480f; color: #fff; }
.nudge button.x { background: transparent; box-shadow: none; color: #6b4200; padding: 4px 8px; font-size: 1.1rem; }
.flycoin { position: fixed; z-index: 31; font-size: 22px; pointer-events: none; }
.earn { font-weight: 800; color: #8a5a00; margin: -4px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 8px 0 14px; max-height: min(50vh, 420px); overflow-y: auto; padding: 4px; overscroll-behavior: contain; }
.grid .ch { grid-column: 1 / -1; text-align: left; font-weight: 800; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; opacity: .75; margin-top: 6px; }
.grid button { padding: 9px 0; font-family: var(--font-display); font-size: 1.05rem; line-height: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.grid button small { font-size: .58rem; letter-spacing: .05em; color: #ffc96b; font-family: var(--font-body); }
.grid button.cur { outline: 3px solid #f59e0b; }
.how { text-align: left; font-size: .9rem; line-height: 1.45; margin: 0 0 16px; padding-left: 1.1em; }
.how li { margin-bottom: 4px; }
.opts { display: grid; gap: 10px; margin: 12px 0 14px; text-align: left; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; }
.opt select { font: 700 .9rem var(--font-body); padding: 8px 10px; border-radius: 10px; border: 2px solid var(--btn); background: #fff4e3; color: var(--card-ink); }
.card .toggle { min-width: 84px; background: #8d7a68; }
.card .toggle[aria-pressed="true"] { background: var(--good); }
.note { font-size: .8rem; font-weight: 600; margin: 0; opacity: .8; }
.intro-art { font-size: 3.2rem; line-height: 1; margin: 4px 0 8px; }
.intro-tag { display: inline-block; background: var(--good); color: #fff; font-weight: 800; font-size: .75rem; border-radius: 8px; padding: 2px 8px; letter-spacing: .06em; text-transform: uppercase; }
@media (max-width: 380px) { .brand { font-size: 1.05rem; } .stat b { font-size: 1rem; } .chip { padding: 6px 8px; } }
@media (prefers-reduced-motion: reduce) { .bokeh i, .card, .tools button.on, .chip.bump { animation: none; } .stat.warn b { animation: none; } .stars .on { animation: none; } body { transition: none; } }
</style>

<div class="bokeh" id="bokeh" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div class="brand"><span data-i18n="title">Tahta Kapılar</span><small><span id="lvlName"></span><span class="tag" id="diffTag" hidden></span></small></div>
    <div class="top-right">
      <div class="chip" title="Coins" id="coinChip" role="button" tabindex="0">🪙 <b id="coins">0</b></div>
      <div class="chip lives" id="livesChip" role="button" tabindex="0" aria-label="Lives">❤️ <b id="lives">5</b><small id="livesTimer" hidden></small></div>
      <button class="icon-btn" id="settings" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>
  <div class="stats">
    <div class="stat"><b id="moves">0</b><span data-i18n="moves">Hamle</span></div>
    <div class="stat"><b id="par">0</b><span data-i18n="par">Hedef</span></div>
    <div class="stat"><b id="left">0</b><span data-i18n="blocks">Blok</span></div>
    <div class="stat" id="timeStat"><b id="time">0:00</b><span data-i18n="time">Süre</span></div>
  </div>
  <div class="stage" id="stage"><canvas id="cv" aria-label="Board"></canvas></div>
  <div class="hint" id="hintText"></div>
  <div class="hint msg" id="hintMsg" aria-live="polite"></div>
  <div class="nudge" id="nudge" hidden role="status">
    <span data-i18n="nudgeText">Zorlanıyor musun?</span>
    <button id="nudgeBtn" type="button" data-i18n="nudgeBtn">💡 İpucu al</button>
    <button id="nudgeX" type="button" class="x" aria-label="Close">×</button>
  </div>
  <div class="tools">
    <button id="hint" type="button" data-i18n="hint">💡 İpucu</button>
    <button id="hammer" type="button" data-i18n="hammer">🔨 Çekiç</button>
    <button id="restart" type="button" data-i18n="restart">↻ Baştan</button>
    <button id="levels" type="button" data-i18n="levels">▦ Bölümler</button>
  </div>
</div>

<div class="overlay" id="winBox" hidden>
  <div class="card">
    <h2 id="winTitle">Harika!</h2>
    <div class="stars" id="stars"></div>
    <p id="winText"></p>
    <p class="earn" id="winEarn" hidden></p>
    <div class="row ad-row"><button id="adDouble" type="button" class="ad" hidden></button></div>
    <div class="row"><button id="replay" type="button" class="ghost" data-i18n="replay">↻ Tekrar</button><button id="next" type="button" data-i18n="next">Sonraki bölüm →</button></div>
  </div>
</div>

<div class="overlay" id="menuBox" hidden>
  <div class="card">
    <h2 data-i18n="levelsTitle">Bölümler</h2>
    <div class="grid" id="grid"></div>
    <div class="row"><button id="closeMenu" type="button" data-i18n="close">Kapat</button></div>
  </div>
</div>

<div class="overlay" id="helpBox" hidden>
  <div class="card">
    <h2 data-i18n="howTitle">Nasıl oynanır?</h2>
    <ul class="how" id="howList"></ul>
    <div class="row"><button id="startBtn" type="button" data-i18n="start">Başla</button></div>
  </div>
</div>

<div class="overlay" id="introBox" hidden>
  <div class="card">
    <span class="intro-tag" data-i18n="newMech">Yeni!</span>
    <div class="intro-art" id="introArt"></div>
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
    <div class="row"><button id="introOk" type="button" data-i18n="gotIt">Anladım</button></div>
  </div>
</div>

<div class="overlay" id="offerBox" hidden>
  <div class="card">
    <div class="intro-art" id="offerArt">💡</div>
    <h2 id="offerTitle"></h2>
    <p id="offerText"></p>
    <div class="row"><button id="offerAd" type="button" class="ad"></button><button id="offerCoins" type="button"></button></div>
    <div class="row" style="margin-top:10px"><button id="offerClose" type="button" class="ghost" data-i18n="close">Kapat</button></div>
  </div>
</div>

<div class="overlay" id="livesBox" hidden>
  <div class="card">
    <div class="intro-art">❤️</div>
    <h2 id="livesTitle"></h2>
    <p id="livesText"></p>
    <div class="big-timer" id="livesBig" hidden></div>
    <div class="row"><button id="adLife" type="button" class="ad" hidden></button><button id="refill" type="button"></button></div>
    <div class="row" style="margin-top:10px"><button id="livesClose" type="button" class="ghost" data-i18n="close">Kapat</button></div>
  </div>
</div>

<div class="overlay" id="confirmBox" hidden>
  <div class="card">
    <h2 data-i18n="leaveTitle">Bölümü bırakıyor musun?</h2>
    <p data-i18n="leaveText">Yarıda bırakırsan 1 can kaybedersin.</p>
    <div class="row"><button id="confirmNo" type="button" class="ghost" data-i18n="cancel">Vazgeç</button><button id="confirmYes" type="button" data-i18n="leaveYes">Bırak (−1 ❤️)</button></div>
  </div>
</div>

<div class="overlay" id="failBox" hidden>
  <div class="card">
    <h2 data-i18n="failTitle">Süre doldu!</h2>
    <p id="failText"></p>
    <div class="row"><button id="retry" type="button" data-i18n="retry">↻ Tekrar dene</button><button id="adTime" type="button" class="ad" hidden></button><button id="addTime" type="button"></button><button id="skip" type="button" class="ghost"></button></div>
  </div>
</div>

<div class="overlay" id="setBox" hidden>
  <div class="card">
    <h2 data-i18n="settingsTitle">Ayarlar</h2>
    <div class="opts">
      <label class="opt" for="langSel"><span data-i18n="language">Dil</span><select id="langSel"></select></label>
      <div class="opt"><span data-i18n="sound">Ses</span><button id="sound" type="button" class="toggle" aria-pressed="true"></button></div>
      <div class="opt"><span data-i18n="vibration">Titreşim</span><button id="vibTgl" type="button" class="toggle" aria-pressed="true"></button></div>
      <div class="opt" id="reminderRow" hidden><span data-i18n="reminder">Günlük hatırlatma</span><button id="remTgl" type="button" class="toggle" aria-pressed="false"></button></div>
    </div>
    <div class="row"><button id="howBtn" type="button" class="ghost" data-i18n="howBtn">Nasıl oynanır?</button><button id="closeSet" type="button" data-i18n="close">Kapat</button></div>
  </div>
</div>

  const b = lv.blocks[i], color = colorOf(lv, st, i);
  const xs = b.cells.map(c=>c[0]+p[0]), ys = b.cells.map(c=>c[1]+p[1]);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);

    if (gt.c !== color || !gateOpen(lv, st, gt)) continue;
    if (b.ax === 'h' && (gt.side === 'T' || gt.side === 'B')) continue; // a sideways-only block cannot leave up/down
    if (b.ax === 'v' && (gt.side === 'L' || gt.side === 'R')) continue;
    const vertical = gt.side==='L'||gt.side==='R';
    const lo = vertical?minY:minX, hi = vertical?maxY:maxX;
    if (lo < gt.s || hi > gt.s+gt.n-1) continue;
    const touching = (gt.side==='L'&&minX===0)||(gt.side==='R'&&maxX===lv.w-1)||(gt.side==='T'&&minY===0)||(gt.side==='B'&&maxY===lv.h-1);
    if (!touching) continue;
    let ok = true;
    for (const [cx,cy] of b.cells.map(c=>[c[0]+p[0],c[1]+p[1]])) {
      if (gt.side==='L') for (let x=cx-1;x>=0&&ok;x--) { const o=g[cy*lv.w+x]; if (o!==-1&&o!==i) ok=false; }
      if (gt.side==='R') for (let x=cx+1;x<lv.w&&ok;x++) { const o=g[cy*lv.w+x]; if (o!==-1&&o!==i) ok=false; }
      if (gt.side==='T') for (let y=cy-1;y>=0&&ok;y--) { const o=g[y*lv.w+cx]; if (o!==-1&&o!==i) ok=false; }
      if (gt.side==='B') for (let y=cy+1;y<lv.h&&ok;y++) { const o=g[y*lv.w+cx]; if (o!==-1&&o!==i) ok=false; }
    }
    if (ok) return gt;
  }
  return null;
}

// What happens to block i when it reaches p: returns { state, gate } (gate null if it did not leave).
function arrive(lv, st, g, i, p, mvAfter) {
  const pos = st.pos.slice(), layer = st.layer.slice(); pos[i] = p;
  const gate = canExit(lv, g, i, p, st);
  if (gate) { if (layer[i] < (lv.blocks[i].layers || []).length) layer[i]++; else pos[i] = null; }
  return { state: { pos, layer, mv: mvAfter }, gate };
}

// Every straight slide from st (one move each). cb(nextState, move) — move = { i, dx, dy, n, to, out }.
function slides(lv, st, cb) {
  const g = occupancy(lv, st.pos);
  for (let i = 0; i < lv.blocks.length; i++) {
    if (!canMove(lv, st, i)) continue;
    for (const [dx, dy] of dirsFor(lv.blocks[i])) {
      let p = st.pos[i], n = 0;
      for (;;) {

        cb(state, { i, dx, dy, n, to: p, out: !!gate });
        if (gate) break;
      }
    }
  }
}

const solved = st => st.pos.every(p => !p);

// Finds a solution from st. mode 'bfs' = shortest (may give up), 'best' = quick best-first, 'auto' = try both.
// Returns { moves, first } or null when the search hits its limit / finds nothing.
function solve(lv, st, limit = 150000, mode = 'auto') {
  const tog = lv.gates.some(g => g.toggle);
  const W = lv.w;
  const key = s => {
    const m = tog ? s.mv % 2 : 0; // only swinging gates care about the move count
    return String.fromCharCode(...s.pos.map(q => q ? 1 + q[0] + q[1] * W : 0), ...s.layer.map(l => l + 1), m + 1);
  };
  const push = (h, it) => { h.push(it); let i = h.length - 1; while (i > 0) { const j = (i - 1) >> 1; if (h[j][0] <= h[i][0]) break; [h[i], h[j]] = [h[j], h[i]]; i = j; } };
  const pop = h => { const top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i;
    if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r; if (m === i) break; [h[i], h[m]] = [h[m], h[i]]; i = m; } } return top; };
  if (solved(st)) return { moves: 0, first: null };
  const modes = mode === 'auto' ? ['bfs', 'best'] : [mode];
  for (const md of modes) {
    const cap = md === 'bfs' && mode === 'auto' ? limit / 4 : limit;
    const seen = new Set([key(st)]); const open = [[0, st, null, 0]]; let head = 0;
    while (md === 'bfs' ? head < open.length : open.length) {
      const [, s, first, d] = md === 'bfs' ? open[head++] : pop(open);
      let found = null;
      slides(lv, s, (ns, m) => {
        if (found) return; const k = key(ns); if (seen.has(k)) return; seen.add(k);
        const f = first || m;
        if (solved(ns)) { found = { moves: d + 1, first: f }; return; }
        const left = ns.pos.filter(Boolean).length + ns.layer.reduce((a, l, i) => a + ((lv.blocks[i].layers || []).length - l), 0);
        const it = [md === 'bfs' ? d + 1 : left * 6 + d + 1, ns, f, d + 1];
        md === 'bfs' ? open.push(it) : push(open, it);
      });
      if (found) return found;
      if (seen.size > cap) break;
    }
  }
  return null;
}

  $('introTitle').textContent = t('intro' + INTRO_KEY[lv.intro]);
  $('introText').textContent = t('intro' + INTRO_KEY[lv.intro] + 'Text');
  $('introBox').hidden = false;
  $('introOk').onclick = () => { seen[lv.intro] = true; store.set('intros', seen); $('introBox').hidden = true; };
}


// ---- hints: the solver runs in a worker from the current position and shows the next slide ----
const HINTS_PER_LEVEL = 3;
let hintsLeft = HINTS_PER_LEVEL, hintShow = null, hintBusy = false, hintWorker = null, hintSeq = 0;
// A hint is only paid for when the player actually makes the suggested move:
// cost 'free' uses one of the level's free hints, 'coins' charges 30 coins, 'none' (ad watched, tutorial) costs nothing.
function askHint(paid = null) {
  if (won || failed || hintBusy || drag || anyOverlay()) return;
  const cost = paid || (hintsLeft > 0 ? 'free' : null);
  if (!cost) { offer('hint'); return; } // no free hints left: ask first (watch an ad in the app, or pay coins)
  hideNudge(); hintBusy = true; paintHint(); audio();
  const id = ++hintSeq, snap = snapState();
  const done = move => {
    if (id !== hintSeq) return;
    hintBusy = false;
    if (JSON.stringify(snapState()) !== JSON.stringify(snap)) { paintHint(); return; } // the board changed while thinking
    if (!move) { say(t('hintNone')); paintHint(); return; }
    hintShow = { ...move, from: snap.pos[move.i], layer0: snap.layer[move.i], cost, at: performance.now(), key: JSON.stringify(snap) };
    track('hint', { level: L + 1 }); paintHint(); saveRun(); tone(880, 0, .12, .1); tone(1320, .08, .15, .1);
  };
  const local = () => { const r = solve(lv, snap, 150000, 'auto'); done(r && r.first); };
  try {
    hintWorker = hintWorker || new Worker(URL.createObjectURL(new Blob([CORE_SRC + '\nonmessage=e=>{const{id,lv,st}=e.data;const r=solve(lv,st,400000,"auto");postMessage({id,move:r&&r.first});};'], { type: 'text/javascript' })));
    hintWorker.onmessage = e => { if (e.data.id === hintSeq) done(e.data.move); };
    hintWorker.onerror = () => { hintWorker = null; local(); };
    hintWorker.postMessage({ id, lv, st: snap });
  } catch { setTimeout(local, 30); }
}
function paintHint() {
  const b = $('hint'); if (!b) return;
  const badge = b.querySelector('b.badge') || b.appendChild(Object.assign(document.createElement('b'), { className: 'badge' }));
  badge.textContent = hintBusy ? '…' : hintsLeft > 0 ? hintsLeft : PRICE.hint + '🪙';
  b.disabled = won || failed;
}
function paintHammer() {
  const b = $('hammer'); if (!b) return;
  const badge = b.querySelector('b.badge') || b.appendChild(Object.assign(document.createElement('b'), { className: 'badge' }));
  badge.textContent = PRICE.hammer + '🪙';
  b.disabled = won || failed;
}
function drawHint(time) {
  if (!hintShow) return;
  if (drag || JSON.stringify(snapState()) !== hintShow.key) return; // hidden while the board changes; settleHint() decides after the move
  const b = lv.blocks[hintShow.i], [fx, fy] = hintShow.from, [tx, ty] = hintShow.to;
  const u = ((time - hintShow.at) % 1400) / 1400, e = u < .7 ? u / .7 : 1;
  const px = ox + (fx + (tx - fx) * e) * cell, py = oy + (fy + (ty - fy) * e) * cell;
  ctx.save();
  ctx.globalAlpha = .5 * (1 - Math.max(0, u - .7) / .3);
  blockPath(b, px, py); ctx.fillStyle = '#fff4e3'; ctx.fill();
  ctx.globalAlpha = 1; ctx.setLineDash([cell * .12, cell * .08]); ctx.lineDashOffset = -time / 40;
  blockPath(b, ox + fx * cell, oy + fy * cell); ctx.lineWidth = cell * .06; ctx.strokeStyle = '#ffb347'; ctx.stroke();
  ctx.restore();
}

// ---- buttons ----
$('hint').onclick = () => askHint();
$('hammer').onclick = () => {
  if (won || failed) return;
  if (!hammerMode && coins < PRICE.hammer) { spend(PRICE.hammer, 'hammer'); return; }
  hammerMode = !hammerMode; say(hammerMode ? t('hammerPick') : '', hammerMode ? 0 : 1); updateHud();
};
$('restart').onclick = () => { if (st.mv === 0 && !failed && !won) { knock(.5); return; } leaveLevel(() => { loadLevel(L); knock(.7); }); };
$('replay').onclick = () => { $('winBox').hidden = true; loadLevel(L); };
$('next').onclick = async () => { $('winBox').hidden = true; await maybeInterstitial(); loadLevel(L + 1); };
function openMenu() {
  const maxOpen = maxOpenIndex();
  let html = '';
  for (let i = 0; i < LEVELS.length; i++) {
    if (i % CHAPTER === 0) html += `<div class="ch">${t('woods')[Math.floor(i / CHAPTER) % 10]} · ${i + 1}–${Math.min(LEVELS.length, i + CHAPTER)}</div>`;
    const s = starsAt(i), locked = i > maxOpen;
    html += `<button type="button" data-i="${i}" class="${mode === 'level' && i === L ? 'cur' : ''}" ${locked ? 'disabled' : ''}>${locked ? '🔒' : i + 1}<small>${s ? '★'.repeat(s) : s === 0 ? '↷' : '&nbsp;'}</small></button>`;
  }
  $('grid').innerHTML = html;
  $('menuBox').hidden = false;
  $('grid').querySelector('.cur')?.scrollIntoView({ block: 'center' });
}
$('levels').onclick = openMenu;
$('grid').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const i = +b.dataset.i; $('menuBox').hidden = true; if (i === L && !won && !failed) return; leaveLevel(() => loadLevel(i)); };
$('closeMenu').onclick = () => { $('menuBox').hidden = true; };
function paintToggles() {
  for (const [id, on] of [['sound', soundOn], ['vibTgl', vibOn], ['remTgl', store.get('reminder', true)]]) { $(id).textContent = t(on ? 'on' : 'off'); $(id).setAttribute('aria-pressed', on); }
}
$('sound').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); paintToggles(); knock(); };
$('vibTgl').onclick = () => { vibOn = !vibOn; store.set('vib', vibOn); paintToggles(); vibrate(20); };
$('remTgl').onclick = async () => { const on = !store.get('reminder', true); store.set('reminder', on); paintToggles(); await scheduleReminder(on); };
$('settings').onclick = () => { if (anyOverlay()) return; $('setBox').hidden = false; };
$('closeSet').onclick = () => { $('setBox').hidden = true; };
$('howBtn').onclick = () => { $('setBox').hidden = true; $('helpBox').hidden = false; };
$('langSel').innerHTML = Object.entries(LANG_NAMES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
$('langSel').onchange = e => { lang = e.target.value; store.set('lang', lang); applyLang(); scheduleReminder(); };
$('retry').onclick = () => { $('failBox').hidden = true; loseLife(); loadLevel(L, { keepFails: true }); if (!lives()) openLives(); };
$('adTime').onclick = async () => { if (!(await watchAd('time'))) return; $('failBox').hidden = true; failed = false; timeLeft = 30; lastTick = 0; paintTime(); updateHud(); saveRun(); };
$('addTime').onclick = () => { if (!spend(PRICE.time, 'time')) return; $('failBox').hidden = true; failed = false; timeLeft = 30; lastTick = 0; paintTime(); updateHud(); saveRun(); };
$('skip').onclick = () => {
  if (!spend(PRICE.skip, 'skip')) return;
  if (progress[lv.id] == null) { progress[lv.id] = 0; store.set('progress', progress); }
  track('level_skip', { level: L + 1 }); $('failBox').hidden = true; loadLevel(L + 1);
};
$('startBtn').onclick = () => { $('helpBox').hidden = true; store.set('seenHelp', true); audio(); if (mode === 'level' && L === 0 && !Object.keys(progress).length) setTimeout(() => { if (mode === 'level' && L === 0 && st.mv === 0) askHint('none'); }, 400); };

// ---- daily reminder (Android app only) ----
// On by default. The permission prompt is shown when the player turns it on, or after
// their first finished level, never on the very first screen.
async function scheduleReminder(ask = false) {
  const ln = native() && plugin('LocalNotifications'); if (!ln) return;
  try {
    await ln.cancel({ notifications: [{ id: 1 }] });
    if (!store.get('reminder', true)) return;
    let perm = await ln.checkPermissions();
    if (perm.display !== 'granted' && ask) { store.set('askedNotif', true); perm = await ln.requestPermissions(); }
    if (perm.display !== 'granted') { if (ask) { store.set('reminder', false); paintToggles(); } return; }
    await ln.schedule({ notifications: [{ id: 1, title: t('reminderTitle'), body: t('reminderBody'), schedule: { on: { hour: 19, minute: 0 }, allowWhileIdle: true } }] });
  } catch {}
}

document.addEventListener('keydown', e => {
  if (e.key === 'r' && !e.ctrlKey && !e.metaKey && !anyOverlay()) $('restart').click();
  if (e.key === 'Escape') { $('menuBox').hidden = true; $('setBox').hidden = true; hammerMode = false; updateHud(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && lv) { saveRun(); mirrorSave(true); } });

// ---- boot ----
$('coinChip').onclick = () => { if (ads.ok && !anyOverlay()) offer('coins'); };
function makeBokeh() {
  const box = $('bokeh'); box.innerHTML = '';
  for (let k = 0; k < 9; k++) { const i = document.createElement('i'); const sz = 60 + Math.random() * 160;
    Object.assign(i.style, { width: sz + 'px', height: sz + 'px', left: Math.random() * 100 + '%', top: Math.random() * 100 + '%', animationDuration: (14 + Math.random() * 16) + 's', animationDelay: (-Math.random() * 20) + 's' });
    box.appendChild(i); }
}
function start(saved) {
  makeBokeh(); initAds(); scheduleReminder(false);
  $('reminderRow').hidden = !(native() && plugin('LocalNotifications'));
  const savedIdx = INDEX_OF[store.get('levelId', '')];
  L = Math.max(0, Math.min(LEVELS.length - 1, saved && saved.level != null ? saved.level : savedIdx ?? maxOpenIndex()));
  applyLang(); setCoins(coins);
  if (!restoreRun()) loadLevel(L);
  if (!store.get('seenHelp', false)) $('helpBox').hidden = false;
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ level: L }));
const boot = data => restoreFromBackup().then(restored => restored ? location.reload() : start(data));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
